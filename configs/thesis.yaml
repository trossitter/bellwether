# Thesis brand configuration for the Bellwether intervention judge.
#
# Update this file when Thesis updates its brand voice.
# No model retraining required — the judge picks this up at runtime.

brand: thesis

audience: >
  Self-optimisers — biohackers, productivity-focused adults who chose Thesis
  because of its evidence-based positioning. They did their research. They expect
  to be spoken to as informed adults, not as generic wellness consumers.

brand_context: >
  Thesis is a data-driven nootropics brand. Campaign positioning: "find your
  brain's best formula." Evidence base: 7.3 million data points from customers,
  a 5-part formulation process. The brand describes itself as a "cognitive
  conditioner that'll actually work" — the emphasis is on certainty and
  performance, not hope or aspiration.

tone:
  descriptor: "warm, specific, non-desperate"
  score_5: >
    Warm, specific, and non-desperate. Sounds like a brand that genuinely cares
    whether the subscriber is getting value. References something concrete about
    their situation — product, cadence, or goal — without being pushy or clinical.
  score_3: >
    Acceptable but impersonal, or slightly generic for a subscriber who has a
    specific reason they are at risk.
  score_1: >
    Pushy, alarming, desperate, or entirely generic — sounds like a retention
    template, not a message written for this person.

# Selected based on calibration against human ratings (Spearman r=0.779 vs 0.725
# for the brand/performance rubric). A/B test with real outcomes will validate.
hypothesis_label: "Warm voice — warm, specific, non-desperate"
