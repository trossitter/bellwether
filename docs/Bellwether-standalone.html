<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bellwether — Retention Intelligence for Thesis</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  /* warm botanical-apothecary palette — blush paper, bone surfaces, warm ink */
  --paper:     #f1e9dc;
  --paper-2:   #e9dfce;
  --bg:        #f1e9dc;
  --bg-tint:   #e8ddca;
  --surface:   #fbf6ec;
  --surface-2: #ffffff;
  --ink:       #221c13;
  --ink-2:     #5e5546;
  --ink-3:     #948975;
  --hairline:  #d8ccb6;
  --hairline-2:#e3d8c4;
  /* ginger — the primary brand/interactive accent (amber jar + root) */
  --accent:    #a4682f;
  --accent-ink:#7c4d22;
  --accent-tint:#eedfc8;
  /* botanical green + apothecary blue — the other two expected hues */
  --green:     #4f6147;
  --green-ink: #3a4a34;
  --green-tint:#dfe5d6;
  --blue:      #3c6377;
  --blue-ink:  #2b4b5b;
  --blue-tint: #dbe5ea;
  /* risk-tier semantics — warmed, the gauge the user liked */
  --terracotta:oklch(0.555 0.138 32);   /* high */
  --gold:      oklch(0.66 0.102 66);     /* elevated */
  --sage:      oklch(0.53 0.055 150);    /* watch */
  --font-display:'Newsreader', Georgia, 'Times New Roman', serif;
  --font-ui:   'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --shadow:    0 4px 22px rgba(60,42,18,0.10);
  --shadow-sm: 0 1px 3px rgba(60,42,18,0.07);
  --maxw:      1080px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:var(--accent-tint);}
.mono{font-family:var(--font-mono);}
h1,h2,h3,p{margin:0;}

/* ───────── top bar ───────── */
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;height:58px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;background:color-mix(in srgb,var(--bg) 82%, transparent);
  -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid transparent;transition:border-color .3s, background .3s;}
.topbar.solid{border-bottom-color:var(--hairline);}
.tb-brand{display:flex;align-items:center;gap:10px;}
.tb-mark{display:flex;}
.tb-name{font-weight:600;font-size:16px;letter-spacing:-0.01em;}
.tb-sep{color:var(--ink-3);font-weight:400;margin:0 1px;}
.tb-for{font-size:14px;color:var(--ink-2);font-weight:450;}
.tb-stats{display:flex;align-items:center;gap:22px;}
.tb-stat{display:flex;align-items:baseline;gap:7px;}
.tb-stat b{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--ink);letter-spacing:-0.01em;}
.tb-stat span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.11em;text-transform:uppercase;color:var(--ink-3);}
.tb-cycle{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);letter-spacing:0.02em;}
@media (max-width:720px){.tb-stats{display:none;}}

/* ───────── section dot nav ───────── */
.dotnav{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:40;
  display:flex;flex-direction:column;gap:14px;}
.dotnav button{appearance:none;border:0;background:transparent;cursor:pointer;
  display:flex;align-items:center;gap:10px;padding:0;color:var(--ink-3);}
.dotnav .dot{width:8px;height:8px;border-radius:50%;background:var(--hairline);
  box-shadow:inset 0 0 0 1px var(--hairline-2);transition:all .25s;}
.dotnav button[data-on="1"] .dot{background:var(--accent);box-shadow:0 0 0 4px var(--accent-tint);}
.dotnav .dot-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;
  opacity:0;transform:translateX(4px);transition:all .2s;white-space:nowrap;}
.dotnav button:hover .dot-label,.dotnav button[data-on="1"] .dot-label{opacity:1;transform:none;}
.dotnav button[data-on="1"]{color:var(--ink);}
@media (max-width:900px){.dotnav{display:none;}}

/* ───────── section scaffold ───────── */
.section{max-width:var(--maxw);margin:0 auto;padding:128px 40px;scroll-margin-top:58px;}
.section--tint{max-width:none;background:var(--bg-tint);
  border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);}
.section--tint > .inner{max-width:var(--maxw);margin:0 auto;padding:128px 40px;}
.eyebrow{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--accent-ink);}
.eyebrow.muted{color:var(--ink-3);}

/* reveal — transform-only entrance; opacity stays 1 so content is never hidden
   if animation is paused (inactive tab), printed, or exported. */
.reveal{opacity:1;}
@media (prefers-reduced-motion:no-preference){
  .reveal.in{animation:revealIn .6s cubic-bezier(.2,.7,.2,1) both;}
  .reveal.in[data-d="1"]{animation-delay:.06s;} .reveal.in[data-d="2"]{animation-delay:.12s;}
  .reveal.in[data-d="3"]{animation-delay:.18s;} .reveal.in[data-d="4"]{animation-delay:.24s;}
}
@keyframes revealIn{from{transform:translateY(16px);}to{transform:none;}}

/* ───────── cover ───────── */
.cover{min-height:100vh;display:flex;flex-direction:column;background:var(--paper);position:relative;}
.cover-head{max-width:var(--maxw);margin:0 auto;width:100%;padding:120px 40px 46px;}
.cover-mark{display:flex;align-items:center;gap:12px;margin-bottom:38px;}
.cover-mark .cm-name{font-family:var(--font-mono);font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:var(--accent-ink);}
.cover-h1{font-family:var(--font-display);font-size:clamp(78px,13vw,190px);font-weight:500;letter-spacing:-0.03em;line-height:0.9;color:var(--ink);}
.cover-line{font-size:clamp(22px,2.9vw,34px);font-weight:400;line-height:1.34;color:var(--ink-2);
  max-width:760px;margin-top:30px;text-wrap:balance;letter-spacing:-0.01em;}
.cover-line b{color:var(--ink);font-weight:500;font-family:var(--font-display);font-style:italic;}
.cover-photo{position:relative;flex:1 1 auto;min-height:320px;width:100%;border-top:1px solid var(--hairline);
  background:url(assets/hero-botanical.png) 50% 40%/cover no-repeat;}
.cover-foot{position:absolute;left:0;right:0;bottom:0;padding:46px 40px 30px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  background:linear-gradient(to top, rgba(28,22,14,.42), rgba(28,22,14,0));}
.cover-foot-in{max-width:var(--maxw);margin:0 auto;width:100%;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;}
.cover-scored{display:flex;align-items:baseline;gap:10px;}
.cover-scored b{font-family:var(--font-mono);font-size:16px;font-weight:600;color:#fff;}
.cover-scored span{font-family:var(--font-mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,.78);}
.scrollcue{display:flex;align-items:center;gap:9px;font-family:var(--font-mono);font-size:10px;
  letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,.8);}
.scrollcue i{width:1px;height:26px;background:rgba(255,255,255,.5);position:relative;overflow:hidden;display:block;}
.scrollcue i::after{content:"";position:absolute;inset:0;background:#fff;animation:cue 2.2s infinite;}
@keyframes cue{0%{transform:translateY(-100%);}55%,100%{transform:translateY(100%);}}
@media (max-width:680px){.cover-h1{font-size:clamp(60px,18vw,90px);}.cover-photo{min-height:260px;}}

/* ───────── the frame (who/why/what/learn) ───────── */
.frame-head{display:flex;flex-direction:column;gap:14px;margin-bottom:48px;max-width:680px;}
.frame-title{font-size:clamp(28px,3.4vw,40px);font-weight:600;letter-spacing:-0.022em;line-height:1.08;text-wrap:balance;}
.frame-sub{font-size:17px;color:var(--ink-2);line-height:1.5;}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hairline);
  border:1px solid var(--hairline);border-radius:10px;overflow:hidden;}
.pillar{background:var(--surface);padding:26px 24px 30px;display:flex;flex-direction:column;gap:12px;min-height:188px;}
.pillar-n{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--accent);}
.pillar-q{font-size:21px;font-weight:600;letter-spacing:-0.01em;}
.pillar-d{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin-top:2px;}
@media (max-width:860px){.pillars{grid-template-columns:repeat(2,1fr);} }
@media (max-width:520px){.pillars{grid-template-columns:1fr;} }

/* ───────── finding ───────── */
.finding-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:36px;margin:28px 0 56px;}
.pull{display:flex;flex-direction:column;gap:8px;}
.pull-num{font-family:var(--font-mono);font-weight:500;font-size:clamp(72px,12vw,148px);line-height:0.86;
  letter-spacing:-0.04em;color:var(--ink);}
.pull-num em{font-style:normal;color:var(--terracotta);}
.pull-label{font-size:19px;color:var(--ink-2);font-weight:450;}
.pull-label b{color:var(--ink);font-weight:600;}
.pull-side{font-family:var(--font-mono);font-size:13px;color:var(--ink-3);line-height:1.7;max-width:230px;text-align:right;}
.pull-side b{color:var(--ink-2);font-weight:600;}

/* archetype table */
.atable{width:100%;border-collapse:collapse;}
.atable thead th{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:0.1em;
  text-transform:uppercase;color:var(--ink-3);text-align:left;padding:0 14px 12px;border-bottom:1px solid var(--hairline);}
.atable thead th.num{text-align:right;}
.atable tbody td{padding:17px 14px;border-bottom:1px solid var(--hairline-2);vertical-align:middle;}
.atable tbody tr:last-child td{border-bottom:0;}
.at-name{font-size:16.5px;font-weight:600;letter-spacing:-0.01em;color:var(--ink);}
.at-blurb{font-size:13px;color:var(--ink-3);margin-top:3px;line-height:1.4;}
.at-num{font-family:var(--font-mono);font-size:15px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums;}
.at-risk{display:flex;align-items:center;justify-content:flex-end;gap:14px;}
.at-bar{width:96px;height:6px;border-radius:99px;background:var(--hairline);overflow:hidden;flex:0 0 auto;}
.at-bar i{display:block;height:100%;border-radius:99px;}
.at-risk-v{font-family:var(--font-mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;min-width:84px;text-align:right;}
.at-risk-v small{font-weight:500;color:var(--ink-3);margin-left:5px;}
.atable tbody tr.hot .at-name{}
.at-flag{display:inline-block;font-family:var(--font-mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--terracotta);border:1px solid color-mix(in srgb,var(--terracotta) 35%, var(--hairline));
  border-radius:3px;padding:1px 5px;margin-left:9px;vertical-align:middle;}
@media (max-width:680px){.at-blurb{display:none;}.at-bar{display:none;}}

/* ───────── decision dashboard (roster + detail + floating rep card) ───────── */
.section--wide{max-width:1248px;}
.dec-head{display:flex;flex-direction:column;gap:14px;margin-bottom:34px;max-width:720px;}
.deckmain{display:grid;grid-template-columns:284px 1fr;gap:28px;align-items:start;}
@media (max-width:980px){.deckmain{grid-template-columns:1fr;}}

/* roster — the "top 5 of 41 flagged" list */
.roster{position:sticky;top:78px;background:var(--surface);border:1px solid var(--hairline);
  border-radius:12px;padding:7px;box-shadow:var(--shadow-sm);}
@media (max-width:980px){.roster{position:static;}}
.roster-head{font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:0.1em;
  text-transform:uppercase;color:var(--ink-3);padding:12px 13px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.roster-foot{font-family:var(--font-mono);font-size:10px;letter-spacing:0.04em;color:var(--ink-3);
  padding:11px 13px 8px;border-top:1px solid var(--hairline-2);margin-top:5px;}
.roster-foot b{color:var(--ink-2);font-weight:600;}
.row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;cursor:pointer;
  background:transparent;padding:12px 13px;border-radius:8px;font:inherit;color:inherit;position:relative;transition:background .15s;}
.row:hover{background:var(--bg-tint);}
.row-on{background:var(--bg-tint);box-shadow:inset 0 0 0 1px var(--hairline);}
.row-on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:99px;background:var(--accent);}
.row-avatar{flex:0 0 34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:var(--bg-tint);border:1px solid var(--hairline);font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--ink-2);}
.row-on .row-avatar{background:var(--surface);}
.row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.row-name{font-size:14.5px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-sku{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-meta{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.row-score{font-family:var(--font-mono);font-size:15px;font-weight:600;}
.row-pip{width:7px;height:7px;border-radius:50%;}

/* detail: dossier main + floating rep card */
.detail{display:grid;grid-template-columns:1fr 250px;gap:30px;align-items:start;}
@media (max-width:760px){.detail{grid-template-columns:1fr;}}
.detail-main{min-width:0;}
.dos-arch{display:flex;align-items:center;gap:10px;margin-bottom:13px;}
.dos-arch .tag{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--accent-ink);background:var(--accent-tint);border-radius:4px;padding:4px 9px;}
.dos-name{font-size:30px;font-weight:600;letter-spacing:-0.025em;line-height:1.05;}
.dos-loc{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);margin-top:8px;letter-spacing:0.02em;}
.dos-headline{font-size:18px;line-height:1.5;color:var(--ink-2);margin-top:18px;max-width:600px;text-wrap:pretty;}

/* rep card — the floating glance the user loves (Product/Cadence/Tenure/LTV/Next renewal) */
.repcard{position:sticky;top:78px;background:var(--surface);border:1px solid var(--hairline);
  border-radius:12px;box-shadow:var(--shadow);overflow:hidden;}
@media (max-width:760px){.repcard{position:static;}}
.rep-hd{padding:13px 15px;border-bottom:1px solid var(--hairline-2);display:flex;align-items:center;gap:10px;background:var(--bg-tint);}
.rep-avatar2{width:30px;height:30px;border-radius:50%;background:var(--surface);border:1px solid var(--hairline);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--ink-2);flex:0 0 auto;}
.rep-hd b{font-size:9.5px;font-family:var(--font-mono);letter-spacing:0.11em;text-transform:uppercase;color:var(--ink-3);font-weight:500;white-space:nowrap;}
.rep-list{padding:4px 15px 12px;}
.rep-row{display:flex;flex-direction:column;gap:3px;padding:12px 0;border-bottom:1px solid var(--hairline-2);}
.rep-row:last-child{border-bottom:0;}
.rep-k{font-family:var(--font-mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3);}
.rep-v{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-0.01em;}
.rep-v.accent{color:var(--accent-ink);}

/* blocks within dossier — compact */
.block{padding:16px 0;border-top:1px solid var(--hairline);margin-top:16px;}
.block:first-of-type{border-top:0;padding-top:12px;margin-top:12px;}
.b-eyebrow{display:flex;align-items:center;gap:11px;margin-bottom:14px;}
.b-eyebrow .n{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 32%, var(--hairline));border-radius:4px;padding:2px 7px;}
.b-eyebrow .t{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;}

/* risk row + gauge (PRESERVED viz) */
.risk-row{display:flex;align-items:center;gap:40px;flex-wrap:wrap;}
.gauge{position:relative;flex:0 0 auto;}
.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
.gauge-num{font-family:var(--font-mono);font-size:44px;font-weight:600;line-height:1;letter-spacing:-0.03em;}
.gauge-tier{font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;}
.risk-side{display:flex;flex-direction:column;gap:14px;flex:1;min-width:210px;}
.delta{font-family:var(--font-mono);font-size:12.5px;font-weight:500;white-space:nowrap;}
.delta-up{color:var(--terracotta);} .delta-down{color:var(--sage);} .delta-flat{color:var(--ink-3);}
.risk-scale{display:flex;flex-direction:column;gap:7px;}
.risk-scale span{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;}
.risk-scale i{width:9px;height:9px;border-radius:2px;}
.proj-note{font-size:13px;color:var(--ink-2);padding-top:10px;border-top:1px dashed var(--hairline);}
.proj-note b{font-family:var(--font-mono);color:var(--sage);font-size:15px;font-weight:600;}

/* riskbar variant */
.riskbar{display:flex;align-items:center;gap:16px;width:360px;max-width:100%;}
.riskbar-num{font-family:var(--font-mono);font-size:40px;font-weight:600;line-height:1;min-width:66px;letter-spacing:-0.02em;}
.riskbar-track{position:relative;flex:1;height:12px;background:var(--hairline);border-radius:99px;}
.riskbar-fill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.7,.2,1),background .4s;}
.riskbar-ghost{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.45;}
.riskbar-tier{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;font-weight:500;}

/* factors */
.factors{display:flex;flex-direction:column;gap:16px;}
.factor-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:7px;}
.factor-label{font-size:14.5px;color:var(--ink);font-weight:500;}
.factor-weight{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--ink-2);}
.factor-weight.protective{color:var(--sage);}
.factor-track{height:4px;background:var(--hairline);border-radius:99px;overflow:hidden;}
.factor-fill{height:100%;border-radius:99px;}
.factor-note{font-size:12.5px;color:var(--ink-3);margin-top:6px;}
.factors-key{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.05em;color:var(--ink-3);margin-top:18px;}

/* action */
.action{background:var(--bg-tint);border:1px solid var(--hairline);border-radius:12px;padding:24px 26px;}
.action-decided{background:var(--surface);box-shadow:inset 0 0 0 1px var(--accent);}
.action-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;}
.action-kind{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3);
  border:1px solid var(--hairline);border-radius:4px;padding:4px 9px;white-space:nowrap;background:var(--surface);}
.action-state{font-family:var(--font-mono);font-size:11px;font-weight:500;white-space:nowrap;}
.action-state.on{color:var(--sage);} .action-state.held{color:var(--ink-3);}
.action-title{font-size:21px;font-weight:600;line-height:1.25;letter-spacing:-0.015em;margin-bottom:11px;}
.action-detail{font-size:14.5px;color:var(--ink-2);line-height:1.55;margin-bottom:16px;max-width:620px;}
.action-why{font-size:13.5px;color:var(--ink-2);line-height:1.55;background:var(--accent-tint);
  border-left:2.5px solid var(--accent);padding:13px 16px;border-radius:0 6px 6px 0;max-width:620px;}
.why-tag{display:block;font-family:var(--font-mono);font-size:9px;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;
  color:var(--accent-ink);margin-bottom:5px;}
.action-feet{display:flex;gap:46px;margin-top:18px;padding-top:16px;border-top:1px solid var(--hairline);}
.feet-k{font-family:var(--font-mono);font-size:9px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3);}
.feet-v{font-size:13px;font-weight:500;color:var(--ink);margin-top:4px;}
.action-cta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px;}
.btn{font:inherit;font-size:13.5px;font-weight:500;border-radius:8px;padding:11px 20px;cursor:pointer;
  border:1px solid transparent;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-ink);}
.btn-ghost{background:transparent;border-color:var(--hairline);color:var(--ink-2);}
.btn-ghost:hover{border-color:var(--ink-3);color:var(--ink);}
.btn-undo{background:transparent;border-color:var(--hairline);color:var(--ink-3);font-size:12.5px;padding:9px 16px;}
.btn-undo:hover{color:var(--ink);border-color:var(--ink-3);}
.alts{display:flex;align-items:center;gap:11px;margin-left:4px;flex-wrap:wrap;}
.alts-label{font-family:var(--font-mono);font-size:9px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3);}
.alt{font-size:12.5px;color:var(--ink-2);border-bottom:1px dashed var(--hairline);padding-bottom:1px;}

/* measure */
.measure{background:var(--surface);border:1px solid var(--hairline);border-radius:12px;padding:24px 26px;}
.measure-live{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sage) 40%, transparent);}
.m-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-bottom:20px;border-bottom:1px solid var(--hairline-2);}
.mstat-k{font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:0.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px;}
.mstat-v{font-family:var(--font-mono);font-size:25px;font-weight:600;line-height:1;letter-spacing:-0.02em;}
.mstat-v.accent{color:var(--sage);}
.mstat-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);margin-top:7px;}
.m-rows{display:flex;flex-direction:column;padding-top:8px;}
.m-line{display:flex;gap:18px;padding:11px 0;border-bottom:1px solid var(--hairline-2);}
.m-line:last-child{border-bottom:0;}
.m-k{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-3);flex:0 0 84px;padding-top:1px;}
.m-v{font-size:13.5px;color:var(--ink);}
.m-active{display:flex;align-items:flex-start;gap:10px;margin-top:18px;font-family:var(--font-mono);font-size:11.5px;line-height:1.5;
  color:var(--ink-2);background:color-mix(in srgb,var(--sage) 10%, transparent);padding:11px 14px;border-radius:7px;}
.m-active.held{background:var(--bg-tint);color:var(--ink-3);}
.m-dot{width:7px;height:7px;border-radius:50%;background:var(--sage);margin-top:4px;flex:0 0 auto;
  box-shadow:0 0 0 0 color-mix(in srgb,var(--sage) 60%,transparent);animation:pulse 2s infinite;}
.m-active.held .m-dot{background:var(--ink-3);animation:none;}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--sage) 50%,transparent);}70%{box-shadow:0 0 0 7px transparent;}100%{box-shadow:0 0 0 0 transparent;}}

/* ───────── messages ───────── */
.msg-head{display:flex;flex-direction:column;gap:14px;margin-bottom:46px;max-width:680px;}
.msg-grid{display:flex;flex-direction:column;gap:20px;}
.msgcard{display:grid;grid-template-columns:200px 1fr;gap:0;background:var(--surface);
  border:1px solid var(--hairline);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);}
@media (max-width:760px){.msgcard{grid-template-columns:1fr;}}
.msg-meta{padding:24px 24px;background:var(--bg-tint);border-right:1px solid var(--hairline);display:flex;flex-direction:column;gap:14px;}
@media (max-width:760px){.msg-meta{border-right:0;border-bottom:1px solid var(--hairline);flex-direction:row;flex-wrap:wrap;gap:18px;align-items:center;}}
.msg-arch{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:0.09em;text-transform:uppercase;color:var(--accent-ink);}
.msg-chips{display:flex;flex-direction:column;gap:8px;}
@media (max-width:760px){.msg-chips{flex-direction:row;flex-wrap:wrap;gap:8px 16px;}}
.msg-chip{display:flex;flex-direction:column;gap:2px;}
.msg-chip .k{font-family:var(--font-mono);font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3);}
.msg-chip .v{font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:-0.01em;}
.msg-chip .v.risk{font-family:var(--font-mono);}
.msg-body{padding:26px 28px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;}
.msg-text{font-size:17px;line-height:1.62;color:var(--ink);text-wrap:pretty;}
.msg-text::before{content:"\201C";color:var(--ink-3);}
.msg-text::after{content:"\201D";color:var(--ink-3);}
.msg-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:16px;border-top:1px solid var(--hairline-2);}
.judge{display:flex;align-items:center;gap:11px;}
.judge-label{font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3);}
.judge-dots{display:flex;gap:3px;}
.judge-dots i{width:7px;height:7px;border-radius:50%;background:var(--hairline);}
.judge-dots i.on{background:var(--accent);}
.judge-dots i.half{background:linear-gradient(90deg,var(--accent) 50%,var(--hairline) 50%);}
.judge-score{font-family:var(--font-mono);font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;}
.judge-score span{color:var(--ink-3);font-weight:500;}
.msg-tag{font-family:var(--font-mono);font-size:10px;letter-spacing:0.06em;color:var(--ink-3);}

/* ───────── close ───────── */
.close{max-width:var(--maxw);margin:0 auto;padding:120px 40px 150px;text-align:left;}
.close-loop{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:clamp(26px,3.6vw,44px);
  font-weight:600;letter-spacing:-0.025em;line-height:1.1;}
.close-loop em{font-style:normal;color:var(--accent);}
.close-loop .arrow{color:var(--ink-3);font-weight:400;}
.close-sub{font-size:17px;color:var(--ink-2);margin-top:26px;max-width:560px;line-height:1.55;}
.close-meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);margin-top:42px;letter-spacing:0.03em;
  padding-top:22px;border-top:1px solid var(--hairline);display:flex;gap:10px;align-items:center;}

/* ───────── botanical-luxe layer ───────── */
.frame-title,.dos-name,.cover-h1,.close-loop{font-family:var(--font-display);}
.frame-title{font-weight:500;letter-spacing:-0.02em;}
.dos-name{font-weight:600;letter-spacing:-0.022em;}

/* section theming — method = botanical green, output = apothecary blue */
#method.section--tint{background:var(--green-tint);}
#method{--accent:var(--green);--accent-ink:var(--green-ink);--accent-tint:#e9eee1;}
#says.section--tint{background:var(--blue-tint);}
#says{--accent:var(--blue);--accent-ink:var(--blue-ink);--accent-tint:#e5eef2;}

/* the drafted notes read as elegant serif quotes */
.msg-text{font-family:var(--font-display);font-style:italic;font-size:20.5px;line-height:1.5;letter-spacing:-0.003em;}

/* finding — botanical figure beside the headline number (breaks the symmetry) */
.finding-top{align-items:stretch;}
.finding-fig{position:relative;flex:0 0 300px;max-width:44%;border-radius:14px;overflow:hidden;margin:0;
  border:1px solid var(--hairline);box-shadow:var(--shadow);min-height:236px;
  background:url(assets/hero-botanical.png) 73% 48%/cover no-repeat;}
.finding-fig figcaption{position:absolute;left:0;right:0;bottom:0;padding:38px 16px 13px;
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.09em;text-transform:uppercase;color:#fff;
  background:linear-gradient(to top,rgba(28,22,14,.62),transparent);}
@media(max-width:760px){.finding-fig{display:none;}}

/* method — neuron feature image beside the thesis */
.method-intro{display:grid;grid-template-columns:308px 1fr;gap:48px;align-items:center;margin-bottom:50px;}
.method-intro .frame-head{margin-bottom:0;}
image-slot.method-fig{display:block;width:100%;height:308px;box-shadow:var(--shadow);}
@media(max-width:760px){.method-intro{grid-template-columns:1fr;gap:28px;}image-slot.method-fig{height:220px;}}

/* decision — single-column dossier + wide two-column "at a glance" */
.detail{display:block;}
.glance{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hairline);
  border:1px solid var(--hairline);border-radius:12px;overflow:hidden;margin-top:24px;box-shadow:var(--shadow-sm);}
.gfact{background:var(--surface);padding:15px 22px;display:flex;flex-direction:column;gap:5px;}
.gfact-k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.11em;text-transform:uppercase;color:var(--ink-3);}
.gfact-v{font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-0.01em;}
.gfact-v.accent{color:var(--accent-ink);}
/* glance shares the header band with the subscriber identity (v1 placement) */
.dos-head{display:flex;justify-content:space-between;align-items:flex-start;gap:46px;flex-wrap:wrap;}
.dos-id{flex:1 1 250px;min-width:230px;}
.dos-head .glance{flex:0 1 448px;margin-top:6px;align-self:flex-start;}
.dos-head .gfact{padding:12px 18px;gap:4px;}
.dos-head .gfact-v{font-size:15px;}
@media(max-width:520px){.glance{grid-template-columns:1fr;}}

/* roster — by-risk / by-reason toggle */
.roster-tabs{display:flex;gap:4px;padding:5px;margin:3px 5px 4px;background:var(--bg-tint);border-radius:10px;}
.roster-tab{flex:1;appearance:none;border:0;cursor:pointer;background:transparent;border-radius:7px;
  font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;
  padding:7px 6px;color:var(--ink-3);transition:all .15s;}
.roster-tab.on{background:var(--surface);color:var(--accent-ink);box-shadow:var(--shadow-sm);}
.roster-tab:hover:not(.on){color:var(--ink-2);}
.roster-cap{font-family:var(--font-mono);font-size:9.5px;line-height:1.5;color:var(--ink-3);padding:3px 14px 10px;letter-spacing:0.02em;}

/* close — a deep botanical band to end on */
.close{max-width:none;margin:0;background:var(--green-ink);color:var(--paper);padding:120px 0 140px;}
.close > *{max-width:var(--maxw);margin-left:auto;margin-right:auto;padding-left:40px;padding-right:40px;width:100%;}
.close .eyebrow.muted{color:rgba(241,233,220,.6);}
.close-loop em{color:var(--accent);font-style:normal;font-weight:500;}
.close-loop .arrow{color:rgba(241,233,220,.4);}
.close-sub{color:rgba(241,233,220,.8);}
.close-meta{color:rgba(241,233,220,.62);border-top-color:rgba(241,233,220,.18);}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;}}
</style>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

<script type="text/babel">
// components.jsx — presentational pieces for Bellwether (Thesis). Exported to window.
const { useState, useEffect, useRef } = React;

// ---- brand six-dot mark (the glyph on the Thesis jar label) ------------
function DotMark({ size = 18, color = "currentColor" }) {
  const r = size * 0.085;
  const cols = [size * 0.34, size * 0.5, size * 0.66];
  const rows = [size * 0.28, size * 0.5, size * 0.72];
  const dots = [];
  cols.forEach((cx) => rows.forEach((cy) => dots.push([cx, cy])));
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} aria-hidden="true">
      {dots.map(([cx, cy], i) => (
        <circle key={i} cx={cx} cy={cy} r={r} fill={color} />
      ))}
    </svg>
  );
}

// ---- reveal-on-scroll wrapper (scroll/viewport check — robust, no IO quirks) ----
function Reveal({ children, as = "div", delay = 0, className = "", ...rest }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    if (shown) return;
    const el = ref.current;
    if (!el) return;
    const check = () => {
      const r = el.getBoundingClientRect();
      const vh = window.innerHeight || document.documentElement.clientHeight;
      if (r.top < vh * 0.92 && r.bottom > 0) { setShown(true); return true; }
      return false;
    };
    if (check()) return;
    const onScroll = () => { if (check()) cleanup(); };
    const cleanup = () => {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return cleanup;
  }, [shown]);
  const Tag = as;
  return (
    <Tag ref={ref} className={`reveal ${shown ? "in" : ""} ${className}`} data-d={delay || undefined} {...rest}>
      {children}
    </Tag>
  );
}

// ---- angle helpers (0deg = top, clockwise) ----------------------------
function polar(cx, cy, r, deg) {
  const rad = (deg * Math.PI) / 180;
  return [cx + r * Math.sin(rad), cy - r * Math.cos(rad)];
}
function arcPath(cx, cy, r, startDeg, endDeg) {
  const [x1, y1] = polar(cx, cy, r, startDeg);
  const [x2, y2] = polar(cx, cy, r, endDeg);
  const large = endDeg - startDeg > 180 ? 1 : 0;
  return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`;
}

// ---- tween hook --------------------------------------------------------
function useTween(target, ms = 900) {
  const [val, setVal] = useState(target);
  const from = useRef(target);
  const raf = useRef(0);
  useEffect(() => {
    const start = performance.now();
    const a = from.current;
    const b = target;
    if (a === b) return;
    cancelAnimationFrame(raf.current);
    const tick = (now) => {
      const p = Math.min(1, (now - start) / ms);
      const e = 1 - Math.pow(1 - p, 3); // easeOutCubic
      setVal(a + (b - a) * e);
      if (p < 1) raf.current = requestAnimationFrame(tick);
      else from.current = b;
    };
    raf.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf.current);
  }, [target, ms]);
  return val;
}

const TIER = {
  high:     { color: "var(--terracotta)", label: "High risk" },
  elevated: { color: "var(--gold)",       label: "Elevated" },
  watch:    { color: "var(--sage)",       label: "Watch" },
};

// ---- radial risk gauge (270° sweep) — PRESERVED, the user likes this ---
function RiskGauge({ score, projected = null, size = 168, stroke = 11, showProjected = false, variant = "gauge" }) {
  const target = showProjected && projected != null ? projected : score;
  const v = useTween(target, 950);
  const display = Math.round(v);
  const tier = window.BELLWETHER.tierOf(display);
  const color = TIER[tier].color;

  if (variant === "bar") {
    const tierNow = window.BELLWETHER.tierOf(display);
    return (
      <div className="riskbar">
        <div className="riskbar-num" style={{ color: TIER[tierNow].color }}>{display}</div>
        <div className="riskbar-track">
          <div className="riskbar-fill" style={{ width: `${display}%`, background: TIER[tierNow].color }} />
          {showProjected && projected != null && (
            <div className="riskbar-ghost" style={{ left: `${projected}%` }} />
          )}
        </div>
        <div className="riskbar-tier" style={{ color: TIER[tierNow].color }}>{TIER[tierNow].label}</div>
      </div>
    );
  }

  const cx = size / 2, cy = size / 2, r = (size - stroke) / 2 - 2;
  const START = -135, SWEEP = 270;
  const end = START + (display / 100) * SWEEP;
  const projEnd = projected != null ? START + (projected / 100) * SWEEP : null;
  return (
    <div className="gauge" style={{ width: size, height: size }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <path d={arcPath(cx, cy, r, START, START + SWEEP)} fill="none"
          style={{ stroke: "var(--hairline)" }} strokeWidth={stroke} strokeLinecap="round" />
        {showProjected && projEnd != null && projEnd < end && (
          <path d={arcPath(cx, cy, r, projEnd, end)} fill="none"
            style={{ stroke: "var(--ink-3)", opacity: 0.35 }} strokeWidth={stroke}
            strokeLinecap="round" strokeDasharray="1 7" />
        )}
        {display > 0 && (
          <path d={arcPath(cx, cy, r, START, end)} fill="none"
            style={{ stroke: color, transition: "stroke .5s ease" }} strokeWidth={stroke} strokeLinecap="round" />
        )}
      </svg>
      <div className="gauge-center">
        <div className="gauge-num" style={{ color }}>{display}</div>
        <div className="gauge-tier" style={{ color }}>{TIER[tier].label}</div>
      </div>
    </div>
  );
}

// ---- delta chip (trend vs last cycle) ---------------------------------
function Delta({ now, prev }) {
  const d = now - prev;
  if (d === 0) return <span className="delta delta-flat">— no change vs. last cycle</span>;
  const up = d > 0;
  return (
    <span className={`delta ${up ? "delta-up" : "delta-down"}`}>
      {up ? "▲" : "▼"} {Math.abs(d)} pts vs. last cycle
    </span>
  );
}

// ---- factor bar (positive = risk-driver, negative = protective) -------
function FactorBar({ label, weight, note, max }) {
  const protective = weight < 0;
  const pct = Math.min(100, (Math.abs(weight) / max) * 100);
  return (
    <div className="factor">
      <div className="factor-head">
        <span className="factor-label">{label}</span>
        <span className={`factor-weight ${protective ? "protective" : ""}`}>
          {protective ? "−" : "+"}{Math.abs(weight)}
        </span>
      </div>
      <div className="factor-track">
        <div className="factor-fill" style={{
          width: `${pct}%`,
          background: protective ? "var(--sage)" : "var(--accent)",
          opacity: protective ? 0.85 : Math.max(0.34, pct / 100),
        }} />
      </div>
      {note && <div className="factor-note">{note}</div>}
    </div>
  );
}

// ---- judge score (LLM-as-judge rating of the drafted message) ---------
function JudgeDots({ score, max = 5 }) {
  const dots = [];
  for (let i = 1; i <= max; i++) {
    const cls = score >= i ? "on" : score >= i - 0.5 ? "half" : "";
    dots.push(<i key={i} className={cls} />);
  }
  return (
    <div className="judge">
      <span className="judge-label">Judge</span>
      <span className="judge-dots">{dots}</span>
      <span className="judge-score">{score.toFixed(1)}<span> / {max.toFixed(1)}</span></span>
    </div>
  );
}

Object.assign(window, { DotMark, Reveal, RiskGauge, Delta, FactorBar, JudgeDots, TIER });

</script>

                {/* The message — primary: this is what the rep is approving */}
                <div style={{
                  background:"var(--surface-2)",border:"1px solid var(--hairline)",
                  borderRadius:"10px",padding:"20px 22px",margin:"16px 0",
                  borderLeft:"3px solid var(--accent)"
                }}>
                  <div style={{fontSize:"13px",fontFamily:"var(--font-mono)",letterSpacing:"0.08em",
                    textTransform:"uppercase",color:"var(--ink-3)",marginBottom:"10px"}}>
                    Draft message
                  </div>
                  <p style={{fontSize:"16px",lineHeight:"1.65",color:"var(--ink)",margin:0,
                    fontStyle:"italic"}}>
                    "{sub.message}"
                  </p>
                  <div style={{marginTop:"14px",paddingTop:"12px",borderTop:"1px solid var(--hairline-2)",
                    display:"flex",alignItems:"center",gap:"10px"}}>
                    <JudgeDots score={sub.judge} />
                  </div>
                </div>

                {/* Approve / hold — right after the message */}
                {!st ?
                  <div className="action-cta">
                    <button className="btn btn-primary" onClick={() => decide("approved")}>Approve &amp; schedule</button>
                    <button className="btn btn-ghost" onClick={() => decide("held")}>Hold &amp; watch</button>
                    <div className="alts">
                      <span className="alts-label">Alternatives</span>
                      {sub.alternatives.map((a, i) => (
                        <button key={i} className="alt" style={{
                          appearance:"none",border:"none",background:"transparent",
                          cursor:"pointer",padding:0,font:"inherit",textAlign:"left"
                        }} onClick={() => decide("approved")}>{a}</button>
                      ))}
                    </div>
                  </div> :
                  <div className="action-cta">
                    <button className="btn btn-undo" onClick={undo}>↺ Undo decision</button>
                  </div>
                }

                {/* Reasoning — secondary, below the decision */}
                <details style={{marginTop:"18px"}}>
                  <summary style={{fontSize:"12px",fontFamily:"var(--font-mono)",letterSpacing:"0.08em",
                    textTransform:"uppercase",color:"var(--ink-3)",cursor:"pointer",userSelect:"none"}}>
                    Why this approach
                  </summary>
                  <div style={{marginTop:"12px"}}>
                    <p className="action-detail">{sub.action.detail}</p>
                    <div className="action-why"><span className="why-tag">Why this, not a discount</span>{sub.action.why}</div>
                    <div className="action-feet">
                      <div><div className="feet-k">Effort</div><div className="feet-v">{sub.action.effort}</div></div>
                      <div><div className="feet-k">Cost</div><div className="feet-v">{sub.action.cost}</div></div>
                    </div>
                  </div>
                </details>
              </div>
            </div>

            {/* Risk + factors — supporting context, collapsed by default */}
            <details style={{marginTop:"16px",borderTop:"1px solid var(--hairline)",paddingTop:"16px"}}>
              <summary style={{fontSize:"12px",fontFamily:"var(--font-mono)",letterSpacing:"0.08em",
                textTransform:"uppercase",color:"var(--ink-3)",cursor:"pointer",
                userSelect:"none",marginBottom:"0"}}>
                Risk signal &amp; factors
              </summary>
              <div style={{marginTop:"16px"}}>
                <div style={{marginBottom:"20px"}}>
                  <div className="b-eyebrow" style={{marginBottom:"12px"}}><span className="n">02</span><span className="t">How risky</span></div>
                  <div className="risk-row">
                    <RiskGauge score={sub.score} projected={projectedRisk(sub)} showProjected={st === "approved"} variant={gaugeStyle} />
                    <div className="risk-side">
                      <Delta now={sub.score} prev={sub.prevScore} />
                      <div className="risk-scale">
                        <span><i style={{ background: "var(--terracotta)" }} />High ≥ 60</span>
                        <span><i style={{ background: "var(--gold)" }} />Elevated 30–59</span>
                        <span><i style={{ background: "var(--sage)" }} />Watch &lt; 30</span>
                      </div>
                      {st === "approved" &&
                        <div className="proj-note">Projected after action: <b>{projectedRisk(sub)}</b>
                          <span> ({TIER[tierOf(projectedRisk(sub))].label.toLowerCase()})</span></div>
                      }
                    </div>
                  </div>
                </div>
                <div className="b-eyebrow" style={{marginBottom:"12px"}}><span className="n">03</span><span className="t">Why it's happening</span></div>
                <div className="factors">
                  {sub.factors.map((f, i) => <FactorBar key={i} {...f} max={maxWeight} />)}
                </div>
                <div className="factors-key">+ adds to risk · − protective signal</div>
              </div>
            </details>

            {/* 04 measure */}
            <div className="block">
              <div className="b-eyebrow"><span className="n">04</span><span className="t">How we'll know it worked</span></div>
              <div className={`measure ${st === "approved" ? "measure-live" : ""}`}>
                <div className="m-grid">
                  <div><div className="mstat-k">Expected risk drop</div><div className="mstat-v accent">−{sub.measure.liftPts} pts</div><div className="mstat-sub">±{sub.measure.ci} (90% CI)</div></div>
                  <div><div className="mstat-k">Holdout (control)</div><div className="mstat-v">{sub.measure.holdoutPct ? `${sub.measure.holdoutPct}%` : "—"}</div><div className="mstat-sub">{sub.measure.holdoutPct ? "matched cohort" : "monitor only"}</div></div>
                  <div><div className="mstat-k">Read-out date</div><div className="mstat-v">{sub.measure.checkBack}</div><div className="mstat-sub">auto check-in</div></div>
                </div>
                <div className="m-rows">
                  <div className="m-line"><span className="m-k">Success</span><span className="m-v">{sub.measure.success}</span></div>
                  <div className="m-line"><span className="m-k">Baseline</span><span className="m-v">{sub.measure.baseline}</span></div>
                </div>
                {st === "approved" &&
                <div className="m-active"><span className="m-dot" /> Experiment live · {100 - sub.measure.holdoutPct}% treated, {sub.measure.holdoutPct}% held back · reads out {sub.measure.checkBack}</div>
                }
                {st === "held" &&
                <div className="m-active held"><span className="m-dot" /> Monitoring only · no treatment applied · re-scores next cycle</div>
                }
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>);

}

// ───────────────────────── Messages ─────────────────────────
function MessagesSection({ subscribers, tierOf }) {
  return (
    <section id="says" className="section--tint" data-screen-label="What it says">
      <div className="inner">
        <Reveal className="msg-head">
          <span className="eyebrow">04 · What it produces</span>
          <h2 className="frame-title">The Bellwether notes</h2>
          <p className="frame-sub">Each message is drafted by Claude from behavioral signals — tenure, formula, billing timing, order cadence — then scored by a separate judge before a human ever sees it. Two brand voice hypotheses were calibrated against human ratings; warm voice selected at Spearman r = 0.779. No templates. No blanket discounts.</p>
        </Reveal>
        <div className="msg-grid">
          {subscribers.map((s, i) => {
            const tier = tierOf(s.score);
            return (
              <Reveal key={s.id} delay={Math.min(4, i + 1)}>
                <div className="msgcard">
                  <div className="msg-meta">
                    <span className="msg-arch">{s.archetype}</span>
                    <div className="msg-chips">
                      <span className="msg-chip"><span className="k">Formula</span><span className="v">{s.formulaShort}</span></span>
                      <span className="msg-chip"><span className="k">Tenure</span><span className="v">{s.tenureLabel}</span></span>
                      <span className="msg-chip"><span className="k">Risk</span><span className="v risk" style={{ color: TIER[tier].color }}>{s.score}%</span></span>
                    </div>
                  </div>
                  <div className="msg-body">
                    <p className="msg-text">{s.message}</p>
                    <div className="msg-foot">
                      <JudgeDots score={s.judge} />
                      <span className="msg-tag">draft · pending send</span>
                    </div>
                  </div>
                </div>
              </Reveal>);

          })}
        </div>
      </div>
    </section>);

}

// ───────────────────────── Close ─────────────────────────
function CloseSection({ fleet }) {
  return (
    <section id="close" className="close" data-screen-label="Close">
      <Reveal as="div" className="eyebrow muted">The loop</Reveal>
      <Reveal as="div" className="close-loop" delay={1} style={{ marginTop: 22 }}>
        <em>Who</em><span className="arrow">→</span><em>Why</em><span className="arrow">→</span><em>What</em><span className="arrow">→</span><em>Learn</em><span className="arrow">↻</span>
      </Reveal>
      <Reveal as="p" className="close-sub" delay={2}>
        Right now, dispatch is simulated — no live sends, no real subscriber touched. The only gap between this and Klaviyo or Zendesk is swapping one adapter class. When outcomes land, they join on subscriber ID and feed the next model cycle. Each run, the thresholds sharpen, the archetypes tighten, and the interventions get closer to what actually keeps a Thesis subscriber.
      </Reveal>
      <Reveal as="div" className="close-meta" delay={3}>
        <DotMark size={14} color="var(--ink-3)" />
        Bellwether · {fleet.cycleLabel} · {fleet.modelNote}
      </Reveal>
    </section>);

}

Object.assign(window, {
  Cover, FindingSection, MethodSection, DecisionSection, MessagesSection, CloseSection, projectedRisk
});
</script>
<script type="text/babel">
// app.jsx — Bellwether (Thesis) shell: topbar, dot-nav, section composition, tweaks.
const { useState, useEffect, useRef } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#a4682f",
  "gaugeStyle": "gauge",
  "tableDensity": "regular"
}/*EDITMODE-END*/;

const NAV = [
  { id: "cover", label: "Top" },
  { id: "finding", label: "Finding" },
  { id: "method", label: "Method" },
  { id: "review", label: "Review" },
  { id: "says", label: "Output" },
];

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const { FLEET, ARCHETYPES, SUBSCRIBERS, tierOf } = window.BELLWETHER;
  const [active, setActive] = useState("cover");
  const [solid, setSolid] = useState(false);

  // topbar solid-on-scroll
  useEffect(() => {
    const onScroll = () => setSolid(window.scrollY > 36);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  // active-section tracking for the dot nav (scroll-based — robust)
  useEffect(() => {
    const ids = NAV.map((n) => n.id).concat("close");
    const pick = () => {
      const mid = window.innerHeight * 0.42;
      let current = "cover";
      ids.forEach((id) => {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top <= mid) current = id;
      });
      setActive(current === "close" ? "says" : current);
    };
    pick();
    window.addEventListener("scroll", pick, { passive: true });
    window.addEventListener("resize", pick);
    return () => {
      window.removeEventListener("scroll", pick);
      window.removeEventListener("resize", pick);
    };
  }, []);

  const jump = (id) => {
    const el = document.getElementById(id);
    if (!el) return;
    const top = el.getBoundingClientRect().top + window.scrollY - (id === "cover" ? 0 : 8);
    window.scrollTo({ top, behavior: "smooth" });
  };

  const rootStyle = {
    "--accent": t.accent,
    "--accent-ink": `color-mix(in oklab, ${t.accent}, #000 26%)`,
    "--accent-tint": `color-mix(in oklab, ${t.accent} 12%, #fff)`,
  };

  return (
    <div style={rootStyle}>
      {/* topbar */}
      <header className={`topbar ${solid ? "solid" : ""}`}>
        <div className="tb-brand">
          <span className="tb-mark"><DotMark size={18} color="var(--accent)" /></span>
          <span className="tb-name">Bellwether</span>
          <span className="tb-sep">·</span>
          <span className="tb-for">for Thesis</span>
        </div>
        <div className="tb-stats">
          <span className="tb-stat"><b>{FLEET.scored.toLocaleString()}</b><span>scored</span></span>
          <span className="tb-stat"><b>{FLEET.atRisk.toLocaleString()}</b><span>at risk</span></span>
          <span className="tb-stat"><b>{FLEET.reviewQueue}</b><span>in review</span></span>
          <span className="tb-cycle">{FLEET.cycleLabel}</span>
        </div>
      </header>

      {/* dot nav */}
      <nav className="dotnav" aria-label="Sections">
        {NAV.map((n) => (
          <button key={n.id} data-on={active === n.id ? "1" : "0"} onClick={() => jump(n.id)} aria-label={n.label}>
            <span className="dot-label">{n.label}</span>
            <span className="dot" />
          </button>
        ))}
      </nav>

      {/* sections */}
      <main>
        <Cover fleet={FLEET} />
        <FindingSection fleet={FLEET} archetypes={ARCHETYPES} />
        <MethodSection />
        <DecisionSection fleet={FLEET} subscribers={SUBSCRIBERS} archetypes={ARCHETYPES} tierOf={tierOf} gaugeStyle={t.gaugeStyle} />
        <MessagesSection subscribers={SUBSCRIBERS} tierOf={tierOf} />
        <CloseSection fleet={FLEET} />
      </main>

      {/* tweaks */}
      <TweaksPanel>
        <TweakSection label="Brand" />
        <TweakColor label="Accent" value={t.accent}
          options={["#a4682f", "#4f6147", "#3c6377", "#7c4d22"]}
          onChange={(v) => setTweak("accent", v)} />
        <TweakSection label="Risk display" />
        <TweakRadio label="Risk viz" value={t.gaugeStyle}
          options={["gauge", "bar"]} onChange={(v) => setTweak("gaugeStyle", v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
